[project]
name = "glin-ml"
dynamic = ["version"]
description = "Instant, exactly-explainable statistical classifiers for AI agents, over MCP."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Akash Chatterjee", email = "akashc2310@gmail.com" },
]
keywords = ["mcp", "model-context-protocol", "explainable-ai", "ebm", "machine-learning", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "interpret-core>=0.7,<0.8",
    "scikit-learn>=1.3,<2",
    "pandas>=2,<3",
    "numpy>=1.24,<3",
    "joblib>=1.3,<2",
    "click>=8.1,<9",
    "mcp>=1.0.0,<3",
]

[project.urls]
Homepage = "https://github.com/AkashChatterjee/glin"
Repository = "https://github.com/AkashChatterjee/glin"

[project.optional-dependencies]
excel = [
    "openpyxl>=3.1",
    "xlrd>=2.0.1",
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "openpyxl>=3.1",
    "xlrd>=2.0.1",
    "xlwt>=1.3",
]

[project.scripts]
glin = "glin.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The version comes from the latest git tag (v0.1.3 -> 0.1.3); there is nothing
# to bump in this file. Untagged commits get a dev version, and a source tree
# with no git metadata falls back to 0.0.0.
[tool.hatch.version]
source = "vcs"
raw-options = { fallback_version = "0.0.0" }

[tool.hatch.build.targets.wheel]
packages = ["glin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
