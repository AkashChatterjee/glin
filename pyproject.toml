[project]
name = "glin-ml"
version = "0.1.2"
description = "Instant, exactly-explainable statistical classifiers for AI agents, over MCP."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Akash Chatterjee", email = "akashc2310@gmail.com" },
]
keywords = ["mcp", "model-context-protocol", "explainable-ai", "ebm", "machine-learning", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "interpret-core>=0.7,<0.8",
    "scikit-learn>=1.3,<2",
    "pandas>=2,<3",
    "numpy>=1.24,<3",
    "joblib>=1.3,<2",
    "click>=8.1,<9",
    "mcp>=1.0.0,<2.0",
]

[project.urls]
Homepage = "https://github.com/AkashChatterjee/glin"
Repository = "https://github.com/AkashChatterjee/glin"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
]

[project.scripts]
glin = "glin.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["glin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
