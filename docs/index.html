<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glin</title>
<meta name="description" content="CLI tool and Python library that equips AI agents with an instant, statistical gut feeling via Explainable Boosting Machines over MCP.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown.min.css">
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    padding: 2.5rem 1rem 4rem;
    display: flex;
    justify-content: center;
    background: Canvas;
  }
  .markdown-body {
    box-sizing: border-box;
    max-width: 780px;
    width: 100%;
  }
  @media (max-width: 767px) {
    .markdown-body { padding: 0 0.5rem; }
  }
  #status {
    max-width: 780px;
    width: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #656d76;
  }
</style>
</head>
<body>
  <div id="status">Loading README&hellip;</div>
  <article id="content" class="markdown-body" hidden></article>

  <script src="https://cdn.jsdelivr.net/npm/marked@13/marked.min.js"></script>
  <script>
    (async () => {
      const statusEl = document.getElementById('status');
      const contentEl = document.getElementById('content');
      try {
        const res = await fetch('./README.md', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const markdown = await res.text();
        contentEl.innerHTML = marked.parse(markdown);
        contentEl.hidden = false;
        statusEl.remove();
      } catch (err) {
        statusEl.textContent = 'Could not load README.md: ' + err.message +
          '. View it directly on GitHub: https://github.com/AkashChatterjee/glin';
      }
    })();
  </script>
</body>
</html>
